name: Initialize production distribution

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish immutable infrastructure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="distribution-infrastructure-v1"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir /tmp/evidence --clobber
            cmp manifest.json /tmp/evidence/manifest.json
            echo "Infrastructure release already valid."
            exit 0
          fi
          gh release create "$tag" manifest.json --repo "$GITHUB_REPOSITORY" --title "Distribution infrastructure v1" --notes "Immutable evidence of the initial public manifest. No legal content update." --target "$GITHUB_SHA"
